# Deploys the sync server (with the web client bundled in) to the
# `chopstick-budget` Fly app. See fly.toml for the app/volume details.
#
# Requires a FLY_API_TOKEN repo secret:
#   fly tokens create deploy -a chopstick-budget -x 8760h
name: Deploy to Fly

on:
  push:
    branches: [master]
  workflow_dispatch:

# Never cancel a release in progress: this app runs a single machine with a
# volume attached, and killing flyctl mid-release can strand the machine.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # --remote-only: Fly's builder does the Docker build, so the runner only
      # uploads the build context and needs no node/yarn setup.
      - run: flyctl deploy --remote-only --wait-timeout 30m
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # The machine stops when idle (min_machines_running = 0), so the Fly
      # health check does not run during the deploy and a broken boot would
      # otherwise land green. This cold-starts the machine and fails the run
      # if it does not come up; --retry covers the cold-start window.
      - name: Smoke test
        run: >
          curl -sSf --max-time 90 --retry 5 --retry-delay 10 --retry-all-errors
          https://chopstick-budget.fly.dev/health
